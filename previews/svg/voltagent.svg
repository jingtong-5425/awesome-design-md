<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">VoltAgent — 设计风格示意图</title><desc id="desc">深黑工程网格配电绿信号与嵌入式代码编辑器。依据 DESIGN.md 演绎，非官网截图。通用字体近似，统一虚构内容用于比较。</desc><defs><linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b5543"/><stop offset=".55" stop-color="#0d3427"/><stop offset="1" stop-color="#101010"/></linearGradient><linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2FD6A1"/><stop offset="1" stop-color="#1a4f3e"/></linearGradient><clipPath id="stage"><rect width="1600" height="880"/></clipPath></defs><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#101010" /><g clip-path="url(#stage)"><text x="64" y="55" fill="#F2F2F2" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start" >VoltAgent</text><text x="650" y="53" fill="#BDBDBD" font-family="Arial,Helvetica,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="500" text-anchor="start" >Product</text><text x="754" y="53" fill="#BDBDBD" font-family="Arial,Helvetica,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="500" text-anchor="start" >Solutions</text><text x="882" y="53" fill="#BDBDBD" font-family="Arial,Helvetica,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="500" text-anchor="start" >Resources</text><text x="1235" y="53" fill="#F2F2F2" font-family="Arial,Helvetica,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="500" text-anchor="start" >Log in</text><rect x="1350" y="20" width="186" height="54" rx="8" fill="#00D992" /><text x="1443" y="54" fill="#101010" font-family="Arial,Helvetica,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="600" text-anchor="middle" >Get started</text><line x1="64" y1="97" x2="1536" y2="97" stroke="#3D3A39" stroke-width="1" /><text x="64" y="171" fill="#2FD6A1" font-family="Menlo,Consolas,monospace" font-siz