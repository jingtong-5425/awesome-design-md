<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">OpenCode AI — 设计风格示意图</title><desc id="desc">暖白等宽手册页面配深色终端与字符标记语汇。依据 DESIGN.md 演绎，非官网截图。通用字体近似，统一虚构内容用于比较。</desc><defs><linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c0ddfd"/><stop offset=".55" stop-color="#e9e8e8"/><stop offset="1" stop-color="#FDFCFC"/></linearGradient><linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#007AFF"/><stop offset="1" stop-color="#acd2fd"/></linearGradient><clipPath id="stage"><rect width="1600" height="880"/></clipPath></defs><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#FDFCFC" /><g clip-path="url(#stage)"><text x="64" y="55" fill="#201D1D" font-family="Menlo,Consolas,monospace" font-size="25" font-weight="700" text-anchor="start" >OpenCode AI</text><text x="650" y="53" fill="#646262" font-family="Arial,Helvetica,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="500" text-anchor="start" >Product</text><text x="754" y="53" fill="#646262" font-family="Arial,Helvetica,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="500" text-anchor="start" >Solutions</text><text x="882" y="53" fill="#646262" font-family="Arial,Helvetica,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="500" text-anchor="start" >Resources</text><text x="1235" y="53" fill="#201D1D" font-family="Arial,Helvetica,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="500" text-anchor="start" >Log in</text><rect x="1350" y="20" width="186" height="54" rx="4" fill="#201D1D" /><text x="1443" y="54" fill="#FDFCFC" font-family="Arial,Helvetica,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="600" text-anchor="middle" >Get started</text><line x1="64" y1="97" x2="1536" y2="97" stroke="#E0DEDE" stroke-width="1" /><text x="64" y="171" fill="#111111" font-family="Menlo,Consolas,monospace" font-s